name: Deploy game to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide Pages publication
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          let publish = process.env.EVENT_NAME === 'workflow_dispatch';
          if (process.env.EVENT_NAME === 'push') {
            const before = process.env.BEFORE_SHA;
            const range = before && !/^0+$/.test(before) ? `${before}..HEAD` : 'HEAD';
            const messages = execFileSync('git', ['log', range, '--format=%B'], { encoding: 'utf8' });
            publish = /^Pages-Deploy: true\r?$/m.test(messages);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build Pages artifact
        if: steps.publication.outputs.publish == 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.publication.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
